<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agora Reader"><link rel="manifest" href="./manifest.webmanifest"><title>Agora Reader</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light dark}body{margin:0;background:Canvas;color:CanvasText}header{background:#152b45;color:white;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px}h1{font-size:23px;margin:0}main{max-width:700px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a.action{border:0;border-radius:12px;background:#235d9c;color:white;padding:12px 14px;font:inherit;text-decoration:none;display:inline-block}section{padding:18px 0;border-bottom:1px solid #9995}input{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #999;border-radius:10px}ul{list-style:none;padding:0}li{padding:12px 0;border-bottom:1px solid #9995;overflow-wrap:anywhere}li a{color:LinkText}small,.muted{opacity:.7}button.secondary{background:#526071}button.danger{background:#9a3942}</style></head><body><header><h1>Agora Reader</h1><small>個人用・アゴラ記事ランチャー</small></header><main><nav><a class="action" href="https://agora-web.jp/" target="_blank" rel="noopener">アゴラを開く ↗</a><a class="action" href="https://www.google.com/search?q=site%3Aagora-web.jp+%22%E4%B9%9D%E6%9D%A1%E4%B8%88%E4%BA%8C%22" target="_blank" rel="noopener">九条丈二の記事を探す ↗</a></nav><section><h2>記事を保存</h2><p class="muted">アゴラの記事URLをコピーして貼り付けます。</p><form id="form"><label>記事URL<input id="url" type="url" required placeholder="https://agora-web.jp/archives/..."></label><p><label>タイトル（省略可）<input id="title" placeholder="記事タイトル"></label></p><button type="submit">ブックマークに追加</button></form><p id="message" role="status"></p></section><section><h2>ブックマーク <span id="count"></span></h2><ul id="items"></ul><button class="secondary" id="export">バックアップを保存</button> <label class="action" for="import">バックアップを読み込む</label><input id="import" type="file" accept="application/json" style="display:none"></section><section><h2>使い方</h2><p>Safariでこのページを開き、共有 →「ホーム画面に追加」。記事は公式サイトで開きます。ブックマークはこの端末内に保存されます。</p><small>アゴラ公式アプリではありません。記事本文の収集・転載は行いません。</small></section></main><script>const key='agora-reader-bookmarks-v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(items))items=[]}catch{}const $=id=>document.getElementById(id);function valid(s){try{let u=new URL(s);return u.protocol==='https:'&&(u.hostname==='agora-web.jp'||u.hostname==='www.agora-web.jp')}catch{return false}}function save(){localStorage.setItem(key,JSON.stringify(items));render()}function render(){const list=$('items');list.replaceChildren();$('count').textContent='('+items.length+')';for(const item of items){const li=document.createElement('li'),a=document.createElement('a'),del=document.createElement('button');a.href=item.url;a.target='_blank';a.rel='noopener';a.textContent=item.title||item.url;del.textContent='削除';del.className='danger';del.style.marginLeft='10px';del.onclick=()=>{items=items.filter(x=>x.url!==item.url);save()};li.append(a,document.createTextNode(' '),del);list.append(li)}if(!items.length){const li=document.createElement('li');li.textContent='まだ保存された記事はありません';list.append(li)}}$('form').onsubmit=e=>{e.preventDefault();const url=$('url').value.trim(),title=$('title').value.trim();if(!valid(url)){$('message').textContent='agora-web.jp のHTTPS記事URLを入力してください';return}if(items.some(x=>x.url===url)){$('message').textContent='保存済みの記事です';return}items.unshift({url,title,created:new Date().toISOString()});save();$('form').reset();$('message').textContent='保存しました'};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agora-reader-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error();const good=data.filter(x=>x&&typeof x.url==='string'&&valid(x.url)).map(x=>({url:x.url,title:typeof x.title==='string'?x.title.slice(0,200):'',created:typeof x.created==='string'?x.created:''}));items=[...good,...items].filter((x,i,arr)=>arr.findIndex(y=>y.url===x.url)===i);save();$('message').textContent=good.length+'件を読み込みました'}catch{$('message').textContent='バックアップを読み込めませんでした'}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
